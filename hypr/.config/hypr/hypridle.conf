general {
    lock_cmd = bash ~/.config/hypr/lock.sh             # Start hyprlock only if it is not already running.
    before_sleep_cmd = loginctl lock-session           # Lock the session before any system sleep event.
    ignore_dbus_inhibit = false                        # Respect idle inhibitors from apps like video players.
}

# The HP P34hc G4 has previously flapped as a hotplug/disconnect event.
# Keep screen-off monitor-scoped and let Hyprland wake DPMS from input instead
# of running a global dpms-on command from hypridle resume/system resume.

listener {
    timeout = 180                                      # Wait 3 minutes of inactivity.
    on-timeout = command -v brightnessctl >/dev/null 2>&1 && brightnessctl -sd rgb:kbd_backlight set 0   # Turn keyboard backlight off.
    on-resume = command -v brightnessctl >/dev/null 2>&1 && brightnessctl -rd rgb:kbd_backlight          # Restore previous keyboard backlight level.
}

listener {
    timeout = 300                                      # Wait 5 minutes of inactivity.
    on-timeout = bash ~/.config/hypr/lock.sh           # Lock the session.
}

listener {
    timeout = 600                                      # Wait 10 minutes of inactivity.
    on-timeout = hyprctl dispatch dpms off "desc:HP Inc. HP P34hc G4 CNC049181P" # Turn the HP monitor off.
    ignore_inhibit = true                              # Still protect the panel if an app holds an idle inhibitor.
}
